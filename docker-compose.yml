version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parvat_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/parvat_rakshak.db:/app/parvat_rakshak.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parvat_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped